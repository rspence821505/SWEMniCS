# This file is used to configure your project.
# Read more about the various options under:
# http://setuptools.readthedocs.io/en/latest/setuptools.html#configuring-setup-using-setup-cfg-files

[metadata]
name = SWE4DVar
version = 1.0.0
description = Shallow Water Equations 4D-Var Data Assimilation Framework
author = Rylan Spence, Benjamin Pachev
author_email = rylan.spence@utexas.edu
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
url = https://github.com/UT-CHG/SWE4DVar
project_urls =
    Documentation = https://github.com/UT-CHG/SWE4DVar#readme
    Source = https://github.com/UT-CHG/SWE4DVar
    Changelog = https://github.com/UT-CHG/SWE4DVar/blob/main/CHANGELOG.md
    Tracker = https://github.com/UT-CHG/SWE4DVar/issues
keywords =
    shallow water equations
    data assimilation
    4D-Var
    FEniCSx
    finite element method
    coastal modeling
    adjoint methods

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.python.org/pypi?%3Aaction=list_classifiers
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Physics
    Topic :: Scientific/Engineering :: Mathematics


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Require a min/specific Python version (comma-separated conditions)
python_requires = >=3.9

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
# Note: FEniCSx (fenics-dolfinx) should be installed via conda
install_requires =
    numpy>=1.20
    scipy>=1.7
    mpi4py>=3.0
    petsc4py>=3.15


[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install SWE4DVar[examples]` or `pip install SWE4DVar[dev]`

# Dependencies for running examples and notebooks
examples =
    h5py
    matplotlib
    adios4dolfinx
    pyvista
    seaborn
    pandas
    tqdm

# Testing dependencies
testing =
    setuptools
    pytest
    pytest-cov

# Development dependencies (includes testing + extras)
dev =
    %(testing)s
    ipython
    jupyter

# All optional dependencies
all =
    %(examples)s
    %(dev)s

[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = swe4dvar.module:function
# For example:
# console_scripts =
#     fibonacci = swe4dvar.skeleton:run
# And any other entry points, for example:
# pyscaffold.cli =
#     awesome = pyscaffoldext.awesome.extension:AwesomeExtension

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this py.test issue.
# addopts =
#     --cov swe4dvar --cov-report term-missing
#     --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
markers =
    benchmark: performance benchmark tests

[bdist_wheel]
# Use this option if your package is pure-python
universal = 1

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.0.2
package = swe4dvar
extensions = 
