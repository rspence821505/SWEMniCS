name: swe4dvar
channels:
  - conda-forge
dependencies:
  # Core Python
  - python>=3.11,<3.14

  # FEniCSx ecosystem
  - fenics-dolfinx>=0.9.0,<0.10
  - fenics-basix>=0.9.0
  - fenics-ffcx>=0.9.0
  - fenics-ufl>=2024.2.0

  # Parallel computing
  - mpi4py>=4.0
  - mpich
  - petsc4py>=3.22
  - slepc4py

  # Scientific computing
  - numpy>=2.0
  - scipy>=1.14
  - h5py

  # Visualization
  - matplotlib>=3.9
  - pyvista>=0.44

  # I/O
  - adios4dolfinx>=0.9.0
  - pandas

  # Utilities
  - tqdm
  - seaborn

  # Development
  - pytest
  - ipython
  - jupyter

  # Pip dependencies
  - pip
  - pip:
    - checkpoint-schedules>=1.0.0
    - loguru>=0.7.0
